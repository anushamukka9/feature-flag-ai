[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-flag-ai"
version = "0.1.0"
description = "Feature flags for safe AI model rollouts: percentage rollouts, canaries, kill switches, targeting rules, rollback history"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Anusha Mukka" },
]
keywords = ["feature-flags", "mlops", "model-rollout", "canary", "ai-safety"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flag-ai = "feature_flag_ai.cli:main"

[project.urls]
Homepage = "https://anushamukka.com"
Repository = "https://github.com/anushamukka9/feature-flag-ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
